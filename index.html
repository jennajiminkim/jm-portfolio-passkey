<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jimin | Passkey</title><style>body{font-family:system-ui;margin:0;background:#fafafa;color:#243049}header{display:flex;justify-content:space-between;align-items:center;background:white;padding:14px 25px;border-bottom:1px solid #dde4f0}button{cursor:pointer;padding:10px 15px;border:1px solid #dae2ee;background:#f4f7fd;color:#2554aa;border-radius:10px}button:hover{background:#e7eefb}#home{width:100%;height:calc(100vh - 70px);border:0}main{max-width:850px;padding:30px;margin:auto}section{padding:25px;background:white;border:1px solid #e2e8f0;border-radius:15px;margin:20px 0}input{padding:12px;border:1px solid #c9d4e4;border-radius:8px}#message{white-space:pre-line;color:#365c9a}.hidden{display:none}.box{padding:14px;background:#f5f8fe;margin:8px 0;border-radius:9px}</style><header><b>jimin. / ACCESS LAB</b><nav><button onclick="toggle(false)">PUBLIC 소개</button> <button onclick="toggle(true)">PRIVATE 🔒</button></nav></header><iframe id="home" src="/portfolio.html" title="기존 공개 자기소개 페이지"></iframe><main id="vault" class="hidden"><p>PRIVATE / PASSKEY</p><h1>나의 비공개 기록실 🔒</h1><p>공개 소개 페이지는 누구나 볼 수 있습니다. 아래의 세 가지 가상 기록은 서버 인증 뒤에만 전송됩니다. 실제 개인정보가 아닙니다.</p><section id="guest"><h2>패스키로 입장</h2><button id="login">패스키 로그인</button><hr><p>처음이라면 과제용 계정 생성 (실명 사용 금지)</p><input id="nick" placeholder="TEST-A"><button id="join">새 계정과 패스키 만들기</button><p>두 계정 테스트는 별도 브라우저 프로필에서 각각 생성하세요.</p></section><section id="inside" class="hidden"><h2 id="welcome"></h2><div id="entries"></div><button id="logout">로그아웃</button><h2>내 패스키 관리</h2><div id="keys"></div><input id="keyname" placeholder="예: 백업 보안 키"><button id="add">두 번째 패스키 등록</button><p>마지막 패스키는 계정 잠김을 막기 위해 삭제할 수 없습니다. 패스키가 0개면 이 과제에는 복구 수단이 없습니다.</p></section><p id="message" role="status"></p></main><script>
const E=x=>document.getElementById(x),key='task8Account';let account=localStorage.getItem(key);
function toggle(priv){E('home').classList.toggle('hidden',priv);E('vault').classList.toggle('hidden',!priv);if(priv)refresh()}function msg(t){E('message').textContent=t}
const dec=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));const enc=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function call(action,body={}){let r=await fetch('/api/auth?action='+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'}),v=await r.json();if(!r.ok)throw Error(v.error+' · HTTP '+r.status);return v}
const create=o=>{o.challenge=dec(o.challenge);o.user.id=dec(o.user.id);o.excludeCredentials=(o.excludeCredentials||[]).map(c=>({...c,id:dec(c.id)}));return o},get=o=>{o.challenge=dec(o.challenge);o.allowCredentials=(o.allowCredentials||[]).map(c=>({...c,id:dec(c.id)}));return o};
function serialize(c){let r=c.response;return {id:c.id,rawId:enc(c.rawId),type:c.type,response:{clientDataJSON:enc(r.clientDataJSON),attestationObject:r.attestationObject?enc(r.attestationObject):undefined,authenticatorData:r.authenticatorData?enc(r.authenticatorData):undefined,signature:r.signature?enc(r.signature):undefined,userHandle:r.userHandle?enc(r.userHandle):null,transports:r.getTransports?.()||[]},clientExtensionResults:c.getClientExtensionResults(),authenticatorAttachment:c.authenticatorAttachment}}
async function register(fresh){try{let x=await call('register-options',fresh?{create:true,name:E('nick').value}:{name:E('keyname').value});let c=await navigator.credentials.create({publicKey:create(x.options)});if(!c)return;let result=await call('register-verify',{flowId:x.flowId,credential:serialize(c),name:fresh?'기본 패스키':E('keyname').value});if(fresh){account=result.accountId;localStorage.setItem(key,account)}msg('등록 성공');refresh()}catch(e){msg(e.name==='NotAllowedError'?'등록 취소: 서버에 새 패스키가 저장되지 않았습니다.':e.message)}}
E('join').onclick=()=>register(true);E('add').onclick=()=>register(false);
E('login').onclick=async()=>{try{if(!account)throw Error('이 브라우저에 계정 식별자가 없습니다. 신규 등록하세요.');let x=await call('login-options',{accountId:account});let c=await navigator.credentials.get({publicKey:get(x.options)});await call('login-verify',{flowId:x.flowId,credential:serialize(c)});msg('서명 검증 성공');refresh()}catch(e){msg(e.name==='NotAllowedError'?'로그인 취소됨':e.message)}};
E('logout').onclick=async()=>{await call('logout');E('guest').classList.remove('hidden');E('inside').classList.add('hidden');msg('로그아웃됨: 이전 세션은 무효입니다.')};
async function refresh(){try{let x=await call('private');E('guest').classList.add('hidden');E('inside').classList.remove('hidden');E('welcome').textContent=x.name+'의 가상 기록';E('entries').replaceChildren(...x.items.map(v=>{let d=document.createElement('div');d.className='box';d.textContent=v.category+' / '+v.title+' — '+v.content;return d}));let keys=await call('list');E('keys').replaceChildren(...keys.credentials.map(c=>{let d=document.createElement('div');d.className='box';let t=document.createElement('span');t.textContent=c.name+' · '+new Date(c.createdAt).toLocaleDateString('ko-KR')+' ';let b=document.createElement('button');b.textContent='삭제';b.onclick=async()=>{if(!confirm('이 패스키를 서버에서 삭제할까요?'))return;try{await call('delete',{credentialId:c.id});refresh()}catch(e){msg(e.message)}};d.append(t,b);return d}));msg('서버가 인증된 계정의 기록만 전송했습니다.')}catch(e){E('guest').classList.remove('hidden');E('inside').classList.add('hidden');msg('비공개 접근 차단: '+e.message)}}if(location.hash==='#private')toggle(true);
</script></html>
